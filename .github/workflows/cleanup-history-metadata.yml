name: Remove obsolete security-cleanup metadata
on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/cleanup-history-metadata.yml"

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Delete obsolete workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/39747277713" || true
          gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/39747275883" || true
          gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/39674920309" || true
      - name: Remove one-time cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f -- ".github/workflows/cleanup-history-metadata.yml"
          git add -A
          git commit -m "security: remove one-time history cleanup"
          git push origin "HEAD:${GITHUB_REF_NAME}"
